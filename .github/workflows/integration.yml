name: integration

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Nightly — catches regressions introduced by nuget.org / dnx / runtime changes.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      package_version:
        description: "GroupDocs.Redaction.Mcp version on nuget.org to test"
        required: false
        default: "26.5.0"
  # Triggered from the main repo's publish workflow right after a NuGet push.
  # Payload: { "package_version": "x.y.z" }
  repository_dispatch:
    types: [nuget-published]

jobs:
  test:
    name: ${{ matrix.os }} · dnx
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      MCP_PACKAGE_VERSION: >-
        ${{ github.event.inputs.package_version
            || github.event.client_payload.package_version
            || '26.5.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # GroupDocs.Redaction's image-area redaction P/Invokes System.Drawing on
      # .NET — Linux runners need libgdiplus (the managed System.Drawing
      # implementation) and libfontconfig1 (its font dependency). Without these,
      # redact_image_area fails. Mirrors the apt-get block in the main repo's
      # docker/Dockerfile. (ttf-mscorefonts is NOT needed: Redaction draws
      # pixel-box overlays, not text glyphs.)
      - name: Install Linux native deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdiplus libfontconfig1

      # macOS runners ship neither GDI+ nor libgdiplus. The dnx-spawned server's
      # dyld does NOT search the Homebrew prefix or /usr/local/lib (a failing run
      # showed its dlopen only probes the package dir, the .NET shared-framework
      # dir, and /usr/lib). So install via Homebrew and copy the dylib into the
      # .NET runtime's shared-framework dir, a path .NET's System.Drawing
      # explicitly probes; libgdiplus's own deps (cairo, glib, …) stay resolvable
      # via the absolute Homebrew paths baked into its load commands. (Windows has
      # GDI+ built in; Linux: apt above.)
      - name: Install macOS native deps
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          brew install mono-libgdiplus
          GDIP="$(brew --prefix mono-libgdiplus)/lib/libgdiplus.dylib"
          otool -L "$GDIP" || true
          for d in "$HOME/.dotnet/shared/Microsoft.NETCore.App/"*/ ; do
            cp -f "$GDIP" "$d"
            echo "installed libgdiplus -> $d"
          done

      - name: Show environment
        shell: bash
        run: |
          dotnet --info
          echo "Testing GroupDocs.Redaction.Mcp@${MCP_PACKAGE_VERSION}"
          dnx --help || true

      - name: Write GroupDocs license (optional)
        # If the repo defines a GROUPDOCS_LICENSE secret (base64 of a .lic file),
        # write it to disk and point GROUPDOCS_LICENSE_PATH at it. Removes the
        # evaluation watermark; evaluation-mode tests still run unlicensed too.
        env:
          GROUPDOCS_LICENSE: ${{ secrets.GROUPDOCS_LICENSE }}
        if: env.GROUPDOCS_LICENSE != ''
        shell: bash
        run: |
          echo "$GROUPDOCS_LICENSE" | base64 -d > "$RUNNER_TEMP/GroupDocs.lic"
          echo "GROUPDOCS_LICENSE_PATH=$RUNNER_TEMP/GroupDocs.lic" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Integration tests
        run: >-
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --logger "console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
